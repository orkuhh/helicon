name: CI

on:
  push:
    branches: [prod]
  pull_request:

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @helicon/browser --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - run: npm run test --workspace @helicon/browser --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - run: npm run build --workspace @helicon/web
      - run: npm run test --workspace @helicon/web

  # The desktop crate is only otherwise compiled while cutting a release, which is far too late to
  # find out that it does not build.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Tauri links WebKitGTK and friends, which the Ubuntu runner does not ship.
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build --workspace @helicon/browser --workspace @helicon/daemon --workspace @helicon/ui --workspace @helicon/server
      - run: npm run build --workspace @helicon/web
      # tauri-build checks every path in bundle.resources before it compiles anything, and those are
      # built rather than committed. This is what the release does through beforeBuildCommand.
      - run: npm run bundle:server --workspace helicon-desktop
      # bundle.externalBin is checked the same way, so fetch the Node.js sidecar too.
      - run: npm run fetch:node --workspace helicon-desktop
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
